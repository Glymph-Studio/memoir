<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -30 -20 Q 0 -120 60 -110" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 20 -20 Q -20 -110 -60 -90" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 0 -50 Q 30 -90 60 -110" stroke="#5a7a4a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
          <!-- leaf -->
          <path d="M 10 -95 Q 50 -120 75 -95 Q 50 -75 10 -95 Z" fill="#9fbf9f" stroke="#5a7a4a" stroke-width="4"/>
          <path d="M 10 -95 Q 40 -100 75 -95" stroke="#5a7a4a" stroke-width="2" fill="none"/>
          <circle cx="-55" cy="30" r="48" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5"/>
          <circle cx="45" cy="40" r="45" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5"/>
          <ellipse cx="-70" cy="10" rx="10" ry="15" fill="#ffffff" opacity="0.5"/>
          <ellipse cx="30" cy="22" rx="9" ry="13" fill="#ffffff" opacity="0.5"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -30 -20 Q 0 -120 60 -110" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 20 -20 Q -20 -110 -60 -90" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 0 -50 Q 30 -90 60 -110" stroke="#5a7a4a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
          <!-- leaf -->
          <path d="M 10 -95 Q 50 -120 75 -95 Q 50 -75 10 -95 Z" fill="#9fbf9f" stroke="#5a7a4a" stroke-width="4"/>
          <path d="M 10 -95 Q 40 -100 75 -95" stroke="#5a7a4a" stroke-width="2" fill="none"/>
          <circle cx="-55" cy="30" r="48" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5"/>
          <circle cx="45" cy="40" r="45" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5"/>
          <ellipse cx="-70" cy="10" rx="10" ry="15" fill="#ffffff" opacity="0.5"/>
          <ellipse cx="30" cy="22" rx="9" ry="13" fill="#ffffff" opacity="0.5"/>

      </g>
    </g>
  </g>
</svg>
