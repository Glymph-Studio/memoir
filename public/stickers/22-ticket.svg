<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -140 -70 L 140 -70 L 140 -30 A 20 20 0 0 0 140 10 L 140 70 L -140 70 L -140 10 A 20 20 0 0 0 -140 -30 Z"
                fill="#f5c876" stroke="#c98f2f" stroke-width="5" stroke-linejoin="round"/>
          <line x1="-40" y1="-70" x2="-40" y2="70" stroke="#c98f2f" stroke-width="3" stroke-dasharray="6 6"/>
          <text x="-90" y="-20" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#76543d">ADMIT</text>
          <text x="-90" y="15" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#76543d">one</text>
          <text x="40" y="10" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="36" fill="#d94f4f">★</text>
          <text x="40" y="45" text-anchor="middle" font-family="monospace" font-size="14" fill="#76543d">NO. 0427</text>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -140 -70 L 140 -70 L 140 -30 A 20 20 0 0 0 140 10 L 140 70 L -140 70 L -140 10 A 20 20 0 0 0 -140 -30 Z"
                fill="#f5c876" stroke="#c98f2f" stroke-width="5" stroke-linejoin="round"/>
          <line x1="-40" y1="-70" x2="-40" y2="70" stroke="#c98f2f" stroke-width="3" stroke-dasharray="6 6"/>
          <text x="-90" y="-20" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#76543d">ADMIT</text>
          <text x="-90" y="15" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#76543d">one</text>
          <text x="40" y="10" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="36" fill="#d94f4f">★</text>
          <text x="40" y="45" text-anchor="middle" font-family="monospace" font-size="14" fill="#76543d">NO. 0427</text>

      </g>
    </g>
  </g>
</svg>
