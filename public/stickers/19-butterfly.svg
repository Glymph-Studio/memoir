<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <ellipse cx="0" cy="0" rx="8" ry="70" fill="#3a1a0d"/>
          <!-- wings -->
          <path d="M -8 -30 Q -110 -80 -120 0 Q -110 60 -20 40 Z" fill="#cfbde0" stroke="#7e5e9e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -8 10 Q -90 30 -80 90 Q -30 100 -10 40 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 8 -30 Q 110 -80 120 0 Q 110 60 20 40 Z" fill="#cfbde0" stroke="#7e5e9e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 8 10 Q 90 30 80 90 Q 30 100 10 40 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <!-- wing dots -->
          <circle cx="-70" cy="-30" r="8" fill="#f5c876"/>
          <circle cx="70" cy="-30" r="8" fill="#f5c876"/>
          <circle cx="-50" cy="60" r="6" fill="#ffffff"/>
          <circle cx="50" cy="60" r="6" fill="#ffffff"/>
          <!-- antennae -->
          <path d="M -4 -60 Q -20 -90 -30 -100" fill="none" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <path d="M 4 -60 Q 20 -90 30 -100" fill="none" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <circle cx="-30" cy="-100" r="5" fill="#3a1a0d"/>
          <circle cx="30" cy="-100" r="5" fill="#3a1a0d"/>

      </g>
      <!-- colored art -->
      <g>

          <ellipse cx="0" cy="0" rx="8" ry="70" fill="#3a1a0d"/>
          <!-- wings -->
          <path d="M -8 -30 Q -110 -80 -120 0 Q -110 60 -20 40 Z" fill="#cfbde0" stroke="#7e5e9e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -8 10 Q -90 30 -80 90 Q -30 100 -10 40 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 8 -30 Q 110 -80 120 0 Q 110 60 20 40 Z" fill="#cfbde0" stroke="#7e5e9e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 8 10 Q 90 30 80 90 Q 30 100 10 40 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <!-- wing dots -->
          <circle cx="-70" cy="-30" r="8" fill="#f5c876"/>
          <circle cx="70" cy="-30" r="8" fill="#f5c876"/>
          <circle cx="-50" cy="60" r="6" fill="#ffffff"/>
          <circle cx="50" cy="60" r="6" fill="#ffffff"/>
          <!-- antennae -->
          <path d="M -4 -60 Q -20 -90 -30 -100" fill="none" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <path d="M 4 -60 Q 20 -90 30 -100" fill="none" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <circle cx="-30" cy="-100" r="5" fill="#3a1a0d"/>
          <circle cx="30" cy="-100" r="5" fill="#3a1a0d"/>

      </g>
    </g>
  </g>
</svg>
