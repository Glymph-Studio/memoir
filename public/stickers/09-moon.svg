<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -60 -110 A 100 100 0 1 0 -60 110 A 80 80 0 1 1 -60 -110 Z"
                fill="#fdf3c7" stroke="#c9a14a" stroke-width="5"/>
          <circle cx="-24" cy="-30" r="6" fill="#76543d" opacity="0.2"/>
          <circle cx="8" cy="40" r="5" fill="#76543d" opacity="0.2"/>
          <path d="M 100 -70 l 6 14 l 14 6 l -14 6 l -6 14 l -6 -14 l -14 -6 l 14 -6 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>
          <path d="M 82 62 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -60 -110 A 100 100 0 1 0 -60 110 A 80 80 0 1 1 -60 -110 Z"
                fill="#fdf3c7" stroke="#c9a14a" stroke-width="5"/>
          <circle cx="-24" cy="-30" r="6" fill="#76543d" opacity="0.2"/>
          <circle cx="8" cy="40" r="5" fill="#76543d" opacity="0.2"/>
          <path d="M 100 -70 l 6 14 l 14 6 l -14 6 l -6 14 l -6 -14 l -14 -6 l 14 -6 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>
          <path d="M 82 62 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>

      </g>
    </g>
  </g>
</svg>
