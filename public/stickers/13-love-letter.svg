<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <rect x="-120" y="-80" width="240" height="160" rx="8" fill="#fdf8f0" stroke="#76543d" stroke-width="5"/>
          <path d="M -120 -80 L 0 30 L 120 -80" fill="none" stroke="#76543d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M -120 80 L -40 0 L 40 0 L 120 80" fill="none" stroke="#76543d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- wax seal heart -->
          <circle cx="0" cy="20" r="26" fill="#d94f4f" stroke="#8a2a2a" stroke-width="3"/>
          <path d="M 0 32 C -18 18 -16 0 -6 -2 C -2 -3 0 0 0 4 C 0 0 2 -3 6 -2 C 16 0 18 18 0 32 Z" fill="#fdf8f0"/>

      </g>
      <!-- colored art -->
      <g>

          <rect x="-120" y="-80" width="240" height="160" rx="8" fill="#fdf8f0" stroke="#76543d" stroke-width="5"/>
          <path d="M -120 -80 L 0 30 L 120 -80" fill="none" stroke="#76543d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M -120 80 L -40 0 L 40 0 L 120 80" fill="none" stroke="#76543d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- wax seal heart -->
          <circle cx="0" cy="20" r="26" fill="#d94f4f" stroke="#8a2a2a" stroke-width="3"/>
          <path d="M 0 32 C -18 18 -16 0 -6 -2 C -2 -3 0 0 0 4 C 0 0 2 -3 6 -2 C 16 0 18 18 0 32 Z" fill="#fdf8f0"/>

      </g>
    </g>
  </g>
</svg>
