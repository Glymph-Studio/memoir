            <line x1="132" y1="0" x2="168" y2="0"/>
            <line x1="-118" y1="-118" x2="-94" y2="-94"/>
            <line x1="94" y1="94" x2="118" y2="118"/>
            <line x1="-118" y1="118" x2="-94" y2="94"/>
            <line x1="94" y1="-94" x2="118" y2="-118"/>
          </g>
          <circle cx="0" cy="0" r="78" fill="#f5c876" stroke="#c98f2f" stroke-width="6"/>
          <circle cx="-24" cy="-14" r="6" fill="#76543d"/>
          <circle cx="24" cy="-14" r="6" fill="#76543d"/>
          <path d="M -28 22 Q 0 50 28 22" fill="none" stroke="#76543d" stroke-width="6" stroke-linecap="round"/>
          <circle cx="-42" cy="12" r="9" fill="#e8a5a5" opacity="0.7"/>
          <circle cx="42" cy="12" r="9" fill="#e8a5a5" opacity="0.7"/>

      </g>
      <!-- colored art -->
      <g>

          <g stroke="#c98f2f" stroke-width="8" stroke-linecap="round">
            <line x1="0" y1="-168" x2="0" y2="-132"/>
            <line x1="0" y1="132" x2="0" y2="168"/>
            <line x1="-168" y1="0" x2="-132" y2="0"/>
            <line x1="132" y1="0" x2="168" y2="0"/>
            <line x1="-118" y1="-118" x2="-94" y2="-94"/>
            <line x1="94" y1="94" x2="118" y2="118"/>
            <line x1="-118" y1="118" x2="-94" y2="94"/>
            <line x1="94" y1="-94" x2="118" y2="-118"/>
          </g>
          <circle cx="0" cy="0" r="78" fill="#f5c876" stroke="#c98f2f" stroke-width="6"/>
          <circle cx="-24" cy="-14" r="6" fill="#76543d"/>
          <circle cx="24" cy="-14" r="6" fill="#76543d"/>
          <path d="M -28 22 Q 0 50 28 22" fill="none" stroke="#76543d" stroke-width="6" stroke-linecap="round"/>
          <circle cx="-42" cy="12" r="9" fill="#e8a5a5" opacity="0.7"/>
          <circle cx="42" cy="12" r="9" fill="#e8a5a5" opacity="0.7"/>

      </g>
