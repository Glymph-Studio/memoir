<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -130 0 L 80 0 L 80 -40 L 150 20 L 80 80 L 80 40 L -130 40 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -110 -15 L -110 55" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
          <path d="M -90 -12 L -90 52" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
          <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="12" fill="#ffffff">NOTE</text>
          <text x="0" y="25" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#ffffff">today →</text>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -130 0 L 80 0 L 80 -40 L 150 20 L 80 80 L 80 40 L -130 40 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -110 -15 L -110 55" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
          <path d="M -90 -12 L -90 52" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
          <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="12" fill="#ffffff">NOTE</text>
          <text x="0" y="25" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#ffffff">today →</text>

      </g>
    </g>
  </g>
</svg>
