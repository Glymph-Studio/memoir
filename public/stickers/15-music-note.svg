<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <ellipse cx="-60" cy="80" rx="42" ry="32" fill="#3a1a0d" stroke="#1d0d06" stroke-width="4" transform="rotate(-20 -60 80)"/>
          <rect x="-28" y="-120" width="16" height="200" fill="#3a1a0d" rx="3"/>
          <path d="M -12 -120 Q 80 -135 80 -70 Q 40 -65 -12 -90 Z" fill="#3a1a0d"/>
          <path d="M -60 80 l -3 80" stroke="#3a1a0d" stroke-width="3" stroke-linecap="round"/>
          <!-- little sparkles -->
          <path d="M 110 -40 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>

      </g>
      <!-- colored art -->
      <g>

          <ellipse cx="-60" cy="80" rx="42" ry="32" fill="#3a1a0d" stroke="#1d0d06" stroke-width="4" transform="rotate(-20 -60 80)"/>
          <rect x="-28" y="-120" width="16" height="200" fill="#3a1a0d" rx="3"/>
          <path d="M -12 -120 Q 80 -135 80 -70 Q 40 -65 -12 -90 Z" fill="#3a1a0d"/>
          <path d="M -60 80 l -3 80" stroke="#3a1a0d" stroke-width="3" stroke-linecap="round"/>
          <!-- little sparkles -->
          <path d="M 110 -40 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#f5c876" stroke="#c98f2f" stroke-width="2"/>

      </g>
    </g>
  </g>
</svg>
