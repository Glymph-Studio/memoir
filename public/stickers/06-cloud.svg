<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -120 40 Q -150 -20 -90 -40 Q -80 -90 -20 -80 Q 10 -120 70 -90 Q 130 -100 130 -30 Q 160 20 110 50 Q 80 70 0 60 Q -80 75 -120 40 Z"
                fill="#ffffff" stroke="#8fb8d8" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="-40" cy="-20" r="6" fill="#8fb8d8" opacity="0.6"/>
          <circle cx="30" cy="-5" r="5" fill="#8fb8d8" opacity="0.5"/>
          <circle cx="60" cy="15" r="4" fill="#8fb8d8" opacity="0.4"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -120 40 Q -150 -20 -90 -40 Q -80 -90 -20 -80 Q 10 -120 70 -90 Q 130 -100 130 -30 Q 160 20 110 50 Q 80 70 0 60 Q -80 75 -120 40 Z"
                fill="#ffffff" stroke="#8fb8d8" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="-40" cy="-20" r="6" fill="#8fb8d8" opacity="0.6"/>
          <circle cx="30" cy="-5" r="5" fill="#8fb8d8" opacity="0.5"/>
          <circle cx="60" cy="15" r="4" fill="#8fb8d8" opacity="0.4"/>

      </g>
    </g>
  </g>
</svg>
