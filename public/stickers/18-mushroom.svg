<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -100 10 Q -120 -100 0 -110 Q 120 -100 100 10 Z" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5" stroke-linejoin="round"/>
          <!-- spots -->
          <circle cx="-45" cy="-55" r="14" fill="#ffffff"/>
          <circle cx="30" cy="-70" r="18" fill="#ffffff"/>
          <circle cx="55" cy="-20" r="11" fill="#ffffff"/>
          <circle cx="-30" cy="-15" r="9" fill="#ffffff"/>
          <!-- stem -->
          <path d="M -45 10 Q -55 100 -30 115 L 30 115 Q 55 100 45 10 Z" fill="#faf4e6" stroke="#c4a882" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="-10" cy="50" r="5" fill="#e8dcc8"/>
          <circle cx="18" cy="80" r="4" fill="#e8dcc8"/>
          <!-- face -->
          <circle cx="-10" cy="60" r="3" fill="#3a1a0d"/>
          <circle cx="15" cy="60" r="3" fill="#3a1a0d"/>
          <path d="M -6 72 Q 2 78 10 72" fill="none" stroke="#3a1a0d" stroke-width="2" stroke-linecap="round"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -100 10 Q -120 -100 0 -110 Q 120 -100 100 10 Z" fill="#d94f4f" stroke="#8a2a2a" stroke-width="5" stroke-linejoin="round"/>
          <!-- spots -->
          <circle cx="-45" cy="-55" r="14" fill="#ffffff"/>
          <circle cx="30" cy="-70" r="18" fill="#ffffff"/>
          <circle cx="55" cy="-20" r="11" fill="#ffffff"/>
          <circle cx="-30" cy="-15" r="9" fill="#ffffff"/>
          <!-- stem -->
          <path d="M -45 10 Q -55 100 -30 115 L 30 115 Q 55 100 45 10 Z" fill="#faf4e6" stroke="#c4a882" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="-10" cy="50" r="5" fill="#e8dcc8"/>
          <circle cx="18" cy="80" r="4" fill="#e8dcc8"/>
          <!-- face -->
          <circle cx="-10" cy="60" r="3" fill="#3a1a0d"/>
          <circle cx="15" cy="60" r="3" fill="#3a1a0d"/>
          <path d="M -6 72 Q 2 78 10 72" fill="none" stroke="#3a1a0d" stroke-width="2" stroke-linecap="round"/>

      </g>
    </g>
  </g>
</svg>
