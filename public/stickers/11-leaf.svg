<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -100 80 Q -90 -90 80 -100 Q 110 -20 100 30 Q 40 110 -100 80 Z"
                fill="#9fbf9f" stroke="#5a7a4a" stroke-width="5"/>
          <path d="M -100 80 Q -20 20 80 -100" fill="none" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round"/>
          <path d="M -70 60 Q -40 30 -20 40" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M -40 30 Q -10 0 20 10" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M -10 0 Q 30 -20 60 -40" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M 20 30 Q 50 0 75 -10" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <!-- stem -->
          <path d="M -100 80 Q -120 100 -130 130" fill="none" stroke="#76543d" stroke-width="6" stroke-linecap="round"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -100 80 Q -90 -90 80 -100 Q 110 -20 100 30 Q 40 110 -100 80 Z"
                fill="#9fbf9f" stroke="#5a7a4a" stroke-width="5"/>
          <path d="M -100 80 Q -20 20 80 -100" fill="none" stroke="#5a7a4a" stroke-width="5" stroke-linecap="round"/>
          <path d="M -70 60 Q -40 30 -20 40" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M -40 30 Q -10 0 20 10" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M -10 0 Q 30 -20 60 -40" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <path d="M 20 30 Q 50 0 75 -10" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>
          <!-- stem -->
          <path d="M -100 80 Q -120 100 -130 130" fill="none" stroke="#76543d" stroke-width="6" stroke-linecap="round"/>

      </g>
    </g>
  </g>
</svg>
