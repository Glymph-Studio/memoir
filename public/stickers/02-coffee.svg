<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <ellipse cx="0" cy="98" rx="110" ry="16" fill="#f5f0e8" stroke="#c4a882" stroke-width="3"/>
          <path d="M -80 -50 L -70 80 Q 0 110 70 80 L 80 -50 Z" fill="#fdf8f0" stroke="#76543d" stroke-width="5"/>
          <ellipse cx="0" cy="-50" rx="80" ry="16" fill="#6b340b"/>
          <path d="M 80 -30 Q 125 -30 125 15 Q 125 55 82 60" fill="none" stroke="#76543d" stroke-width="10" stroke-linecap="round"/>
          <g fill="none" stroke="#c4a882" stroke-width="5" stroke-linecap="round" opacity="0.8">
            <path d="M -30 -78 Q -40 -110 -25 -130 Q -10 -145 -25 -165"/>
            <path d="M 10 -78 Q 0 -110 15 -130 Q 30 -145 15 -165"/>
            <path d="M 45 -78 Q 55 -110 40 -130 Q 25 -145 40 -165"/>
          </g>

      </g>
      <!-- colored art -->
      <g>

          <ellipse cx="0" cy="98" rx="110" ry="16" fill="#f5f0e8" stroke="#c4a882" stroke-width="3"/>
          <path d="M -80 -50 L -70 80 Q 0 110 70 80 L 80 -50 Z" fill="#fdf8f0" stroke="#76543d" stroke-width="5"/>
          <ellipse cx="0" cy="-50" rx="80" ry="16" fill="#6b340b"/>
          <path d="M 80 -30 Q 125 -30 125 15 Q 125 55 82 60" fill="none" stroke="#76543d" stroke-width="10" stroke-linecap="round"/>
          <g fill="none" stroke="#c4a882" stroke-width="5" stroke-linecap="round" opacity="0.8">
            <path d="M -30 -78 Q -40 -110 -25 -130 Q -10 -145 -25 -165"/>
            <path d="M 10 -78 Q 0 -110 15 -130 Q 30 -145 15 -165"/>
            <path d="M 45 -78 Q 55 -110 40 -130 Q 25 -145 40 -165"/>
          </g>

      </g>
    </g>
  </g>
</svg>
