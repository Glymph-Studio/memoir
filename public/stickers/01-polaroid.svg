          <rect x="-120" y="-140" width="240" height="280" rx="8" fill="#ffffff" stroke="#e7dfd0" stroke-width="4"/>
          <rect x="-100" y="-120" width="200" height="180" rx="3" fill="#d6e6ef"/>
          <circle cx="50" cy="-85" r="18" fill="#f5c876"/>
          <path d="M-100 20 Q -60 -30 -10 -5 Q 40 -40 100 -5 L100 60 L-100 60 Z" fill="#9fbf9f"/>
          <path d="M-100 40 Q -60 10 -10 25 Q 40 0 100 20 L100 60 L-100 60 Z" fill="#7ea87f"/>
          <path d="M-72 -92 c -8 -14 -28 -14 -28 4 c 0 16 28 28 28 28 s 28 -12 28 -28 c 0 -18 -20 -18 -28 -4 z" fill="#e87a5d"/>
          <text x="0" y="105" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#76543d">memories</text>

      </g>
      <!-- colored art -->
      <g>

          <rect x="-120" y="-140" width="240" height="280" rx="8" fill="#ffffff" stroke="#e7dfd0" stroke-width="4"/>
          <rect x="-100" y="-120" width="200" height="180" rx="3" fill="#d6e6ef"/>
          <circle cx="50" cy="-85" r="18" fill="#f5c876"/>
          <path d="M-100 20 Q -60 -30 -10 -5 Q 40 -40 100 -5 L100 60 L-100 60 Z" fill="#9fbf9f"/>
          <path d="M-100 40 Q -60 10 -10 25 Q 40 0 100 20 L100 60 L-100 60 Z" fill="#7ea87f"/>
          <path d="M-72 -92 c -8 -14 -28 -14 -28 4 c 0 16 28 28 28 28 s 28 -12 28 -28 c 0 -18 -20 -18 -28 -4 z" fill="#e87a5d"/>
          <text x="0" y="105" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#76543d">memories</text>

      </g>
    </g>
  </g>
</svg>
