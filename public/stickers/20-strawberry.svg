<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -80 -40 Q 0 140 80 -40 Q 60 -80 0 -70 Q -60 -80 -80 -40 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5"/>
          <!-- seeds -->
          <g fill="#f5c876" stroke="#c98f2f" stroke-width="1.5">
            <ellipse cx="-40" cy="-10" rx="4" ry="6"/>
            <ellipse cx="0" cy="0" rx="4" ry="6"/>
            <ellipse cx="40" cy="-10" rx="4" ry="6"/>
            <ellipse cx="-20" cy="30" rx="4" ry="6"/>
            <ellipse cx="20" cy="30" rx="4" ry="6"/>
            <ellipse cx="-45" cy="50" rx="4" ry="6"/>
            <ellipse cx="0" cy="60" rx="4" ry="6"/>
            <ellipse cx="45" cy="50" rx="4" ry="6"/>
          </g>
          <!-- leaves -->
          <path d="M -60 -60 L -30 -80 L -15 -105 L 0 -80 L 15 -105 L 30 -80 L 60 -60 L 40 -50 L 20 -65 L 0 -45 L -20 -65 L -40 -50 Z"
                fill="#9fbf9f" stroke="#5a7a4a" stroke-width="4" stroke-linejoin="round"/>
          <path d="M 0 -70 L 0 -100" stroke="#5a7a4a" stroke-width="4" stroke-linecap="round"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -80 -40 Q 0 140 80 -40 Q 60 -80 0 -70 Q -60 -80 -80 -40 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5"/>
          <!-- seeds -->
          <g fill="#f5c876" stroke="#c98f2f" stroke-width="1.5">
            <ellipse cx="-40" cy="-10" rx="4" ry="6"/>
            <ellipse cx="0" cy="0" rx="4" ry="6"/>
            <ellipse cx="40" cy="-10" rx="4" ry="6"/>
            <ellipse cx="-20" cy="30" rx="4" ry="6"/>
            <ellipse cx="20" cy="30" rx="4" ry="6"/>
            <ellipse cx="-45" cy="50" rx="4" ry="6"/>
            <ellipse cx="0" cy="60" rx="4" ry="6"/>
            <ellipse cx="45" cy="50" rx="4" ry="6"/>
          </g>
          <!-- leaves -->
          <path d="M -60 -60 L -30 -80 L -15 -105 L 0 -80 L 15 -105 L 30 -80 L 60 -60 L 40 -50 L 20 -65 L 0 -45 L -20 -65 L -40 -50 Z"
                fill="#9fbf9f" stroke="#5a7a4a" stroke-width="4" stroke-linejoin="round"/>
          <path d="M 0 -70 L 0 -100" stroke="#5a7a4a" stroke-width="4" stroke-linecap="round"/>

      </g>
    </g>
  </g>
</svg>
