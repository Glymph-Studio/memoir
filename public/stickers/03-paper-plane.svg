<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -130 40 L 130 -90 L 70 110 L 10 40 L -40 95 Z" fill="#fdf8f0" stroke="#3a1a0d" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -130 40 L 130 -90 L 10 40 Z" fill="#8fb8d8"/>
          <path d="M 10 40 L 70 110 L 40 15 Z" fill="#bfd6e6"/>
          <path d="M -130 40 L 10 40 M 130 -90 L 10 40" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <g fill="none" stroke-linecap="round">
            <path d="M -160 80 Q -130 70 -100 75" stroke="#e8a5a5" stroke-width="5"/>
            <path d="M -170 100 Q -135 90 -110 96" stroke="#f5c876" stroke-width="4"/>
          </g>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -130 40 L 130 -90 L 70 110 L 10 40 L -40 95 Z" fill="#fdf8f0" stroke="#3a1a0d" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -130 40 L 130 -90 L 10 40 Z" fill="#8fb8d8"/>
          <path d="M 10 40 L 70 110 L 40 15 Z" fill="#bfd6e6"/>
          <path d="M -130 40 L 10 40 M 130 -90 L 10 40" stroke="#3a1a0d" stroke-width="4" stroke-linecap="round"/>
          <g fill="none" stroke-linecap="round">
            <path d="M -160 80 Q -130 70 -100 75" stroke="#e8a5a5" stroke-width="5"/>
            <path d="M -170 100 Q -135 90 -110 96" stroke="#f5c876" stroke-width="4"/>
          </g>

      </g>
    </g>
  </g>
</svg>
