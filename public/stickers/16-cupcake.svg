<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -90 0 L 90 0 L 70 110 Q 0 130 -70 110 Z" fill="#f5c876" stroke="#c98f2f" stroke-width="5" stroke-linejoin="round"/>
          <!-- wrapper stripes -->
          <path d="M -70 20 L -60 118 M -40 10 L -35 122 M -10 5 L -8 125 M 20 5 L 18 124 M 50 10 L 45 120 M 70 20 L 60 115" stroke="#c98f2f" stroke-width="4" stroke-linecap="round"/>
          <!-- frosting -->
          <path d="M -80 10 Q -100 -30 -50 -40 Q -60 -80 0 -70 Q 60 -90 60 -40 Q 100 -30 80 10 Z" fill="#f5c5c5" stroke="#c88383" stroke-width="5"/>
          <circle cx="-30" cy="-35" r="10" fill="#d94f4f"/>
          <circle cx="20" cy="-50" r="8" fill="#8fb8d8"/>
          <circle cx="45" cy="-20" r="9" fill="#9fbf9f"/>
          <!-- cherry -->
          <circle cx="10" cy="-80" r="14" fill="#d94f4f" stroke="#8a2a2a" stroke-width="3"/>
          <path d="M 10 -94 Q 20 -115 30 -110" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -90 0 L 90 0 L 70 110 Q 0 130 -70 110 Z" fill="#f5c876" stroke="#c98f2f" stroke-width="5" stroke-linejoin="round"/>
          <!-- wrapper stripes -->
          <path d="M -70 20 L -60 118 M -40 10 L -35 122 M -10 5 L -8 125 M 20 5 L 18 124 M 50 10 L 45 120 M 70 20 L 60 115" stroke="#c98f2f" stroke-width="4" stroke-linecap="round"/>
          <!-- frosting -->
          <path d="M -80 10 Q -100 -30 -50 -40 Q -60 -80 0 -70 Q 60 -90 60 -40 Q 100 -30 80 10 Z" fill="#f5c5c5" stroke="#c88383" stroke-width="5"/>
          <circle cx="-30" cy="-35" r="10" fill="#d94f4f"/>
          <circle cx="20" cy="-50" r="8" fill="#8fb8d8"/>
          <circle cx="45" cy="-20" r="9" fill="#9fbf9f"/>
          <!-- cherry -->
          <circle cx="10" cy="-80" r="14" fill="#d94f4f" stroke="#8a2a2a" stroke-width="3"/>
          <path d="M 10 -94 Q 20 -115 30 -110" fill="none" stroke="#5a7a4a" stroke-width="3" stroke-linecap="round"/>

      </g>
    </g>
  </g>
</svg>
