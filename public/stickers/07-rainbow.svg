<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -160 95 Q 0 -180 160 95" fill="none" stroke="#e87a5d" stroke-width="22" stroke-linecap="round"/>
          <path d="M -132 95 Q 0 -140 132 95" fill="none" stroke="#f5c876" stroke-width="22" stroke-linecap="round"/>
          <path d="M -104 95 Q 0 -100 104 95" fill="none" stroke="#b5d8c0" stroke-width="22" stroke-linecap="round"/>
          <path d="M -76 95 Q 0 -60 76 95" fill="none" stroke="#8fb8d8" stroke-width="22" stroke-linecap="round"/>
          <ellipse cx="-140" cy="95" rx="38" ry="20" fill="#ffffff" stroke="#c4a882" stroke-width="4"/>
          <ellipse cx="140" cy="95" rx="38" ry="20" fill="#ffffff" stroke="#c4a882" stroke-width="4"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -160 95 Q 0 -180 160 95" fill="none" stroke="#e87a5d" stroke-width="22" stroke-linecap="round"/>
          <path d="M -132 95 Q 0 -140 132 95" fill="none" stroke="#f5c876" stroke-width="22" stroke-linecap="round"/>
          <path d="M -104 95 Q 0 -100 104 95" fill="none" stroke="#b5d8c0" stroke-width="22" stroke-linecap="round"/>
          <path d="M -76 95 Q 0 -60 76 95" fill="none" stroke="#8fb8d8" stroke-width="22" stroke-linecap="round"/>
          <ellipse cx="-140" cy="95" rx="38" ry="20" fill="#ffffff" stroke="#c4a882" stroke-width="4"/>
          <ellipse cx="140" cy="95" rx="38" ry="20" fill="#ffffff" stroke="#c4a882" stroke-width="4"/>

      </g>
    </g>
  </g>
</svg>
