<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -120 -100 L -10 -90 L -10 100 L -120 90 Z" fill="#a86b8f" stroke="#6e3f5e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 120 -100 L 10 -90 L 10 100 L 120 90 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -10 -90 L 10 -90 L 10 100 L -10 100 Z" fill="#fdf8f0" stroke="#76543d" stroke-width="3"/>
          <!-- lines -->
          <g stroke="#c4a882" stroke-width="2" stroke-linecap="round">
            <line x1="-100" y1="-60" x2="-30" y2="-55"/>
            <line x1="-100" y1="-30" x2="-30" y2="-25"/>
            <line x1="-100" y1="0" x2="-30" y2="5"/>
            <line x1="-100" y1="30" x2="-30" y2="35"/>
            <line x1="-100" y1="60" x2="-30" y2="65"/>
            <line x1="30" y1="-55" x2="100" y2="-60"/>
            <line x1="30" y1="-25" x2="100" y2="-30"/>
            <line x1="30" y1="5" x2="100" y2="0"/>
            <line x1="30" y1="35" x2="100" y2="30"/>
            <line x1="30" y1="65" x2="100" y2="60"/>
          </g>
          <!-- bookmark -->
          <path d="M 40 -100 L 40 -30 L 55 -45 L 70 -30 L 70 -100 Z" fill="#f5c876" stroke="#c98f2f" stroke-width="3"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -120 -100 L -10 -90 L -10 100 L -120 90 Z" fill="#a86b8f" stroke="#6e3f5e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 120 -100 L 10 -90 L 10 100 L 120 90 Z" fill="#e8a5a5" stroke="#b76e7c" stroke-width="5" stroke-linejoin="round"/>
          <path d="M -10 -90 L 10 -90 L 10 100 L -10 100 Z" fill="#fdf8f0" stroke="#76543d" stroke-width="3"/>
          <!-- lines -->
          <g stroke="#c4a882" stroke-width="2" stroke-linecap="round">
            <line x1="-100" y1="-60" x2="-30" y2="-55"/>
            <line x1="-100" y1="-30" x2="-30" y2="-25"/>
            <line x1="-100" y1="0" x2="-30" y2="5"/>
            <line x1="-100" y1="30" x2="-30" y2="35"/>
            <line x1="-100" y1="60" x2="-30" y2="65"/>
            <line x1="30" y1="-55" x2="100" y2="-60"/>
            <line x1="30" y1="-25" x2="100" y2="-30"/>
            <line x1="30" y1="5" x2="100" y2="0"/>
            <line x1="30" y1="35" x2="100" y2="30"/>
            <line x1="30" y1="65" x2="100" y2="60"/>
          </g>
          <!-- bookmark -->
          <path d="M 40 -100 L 40 -30 L 55 -45 L 70 -30 L 70 -100 Z" fill="#f5c876" stroke="#c98f2f" stroke-width="3"/>

      </g>
    </g>
  </g>
</svg>
