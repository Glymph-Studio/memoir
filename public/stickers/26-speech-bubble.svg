<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M -130 -80 Q -140 -80 -140 -70 L -140 60 Q -140 70 -130 70 L 60 70 Q 70 70 70 80 L 70 110 L 100 70 L 130 70 Q 140 70 140 60 L 140 -70 Q 140 -80 130 -80 Z"
                fill="#ffffff" stroke="#3a1a0d" stroke-width="5" stroke-linejoin="round"/>
          <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="#3a1a0d">remember</text>
          <text x="0" y="38" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="#e87a5d">this ♡</text>

      </g>
      <!-- colored art -->
      <g>

          <path d="M -130 -80 Q -140 -80 -140 -70 L -140 60 Q -140 70 -130 70 L 60 70 Q 70 70 70 80 L 70 110 L 100 70 L 130 70 Q 140 70 140 60 L 140 -70 Q 140 -80 130 -80 Z"
                fill="#ffffff" stroke="#3a1a0d" stroke-width="5" stroke-linejoin="round"/>
          <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="#3a1a0d">remember</text>
          <text x="0" y="38" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="#e87a5d">this ♡</text>

      </g>
    </g>
  </g>
</svg>
