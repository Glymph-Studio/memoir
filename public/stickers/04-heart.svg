<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <path d="M 0 100 C -140 0 -130 -120 -55 -115 C -20 -110 0 -80 0 -60 C 0 -80 20 -110 55 -115 C 130 -120 140 0 0 100 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5"/>
          <path d="M -62 -72 Q -42 -88 -26 -76" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
          <path d="M -90 -30 Q 0 45 90 -30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 7" opacity="0.6"/>

      </g>
      <!-- colored art -->
      <g>

          <path d="M 0 100 C -140 0 -130 -120 -55 -115 C -20 -110 0 -80 0 -60 C 0 -80 20 -110 55 -115 C 130 -120 140 0 0 100 Z"
                fill="#e87a5d" stroke="#b84a35" stroke-width="5"/>
          <path d="M -62 -72 Q -42 -88 -26 -76" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
          <path d="M -90 -30 Q 0 45 90 -30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 7" opacity="0.6"/>

      </g>
    </g>
  </g>
</svg>
