<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <circle cx="0" cy="0" r="120" fill="#2a2a2a" stroke="#111" stroke-width="4"/>
          <circle cx="0" cy="0" r="100" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="80" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="60" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="38" fill="#e87a5d" stroke="#b84a35" stroke-width="4"/>
          <circle cx="0" cy="0" r="8" fill="#2a2a2a"/>
          <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#fdf8f0">memoir</text>
          <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="7" fill="#fdf8f0">♪ 45 RPM ♪</text>

      </g>
      <!-- colored art -->
      <g>

          <circle cx="0" cy="0" r="120" fill="#2a2a2a" stroke="#111" stroke-width="4"/>
          <circle cx="0" cy="0" r="100" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="80" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="60" fill="none" stroke="#3a3a3a" stroke-width="2"/>
          <circle cx="0" cy="0" r="38" fill="#e87a5d" stroke="#b84a35" stroke-width="4"/>
          <circle cx="0" cy="0" r="8" fill="#2a2a2a"/>
          <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#fdf8f0">memoir</text>
          <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="7" fill="#fdf8f0">♪ 45 RPM ♪</text>

      </g>
    </g>
  </g>
</svg>
