<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <circle cx="-80" cy="70" r="55" fill="none" stroke="#3a1a0d" stroke-width="7"/>
          <circle cx="80" cy="70" r="55" fill="none" stroke="#3a1a0d" stroke-width="7"/>
          <circle cx="-80" cy="70" r="6" fill="#3a1a0d"/>
          <circle cx="80" cy="70" r="6" fill="#3a1a0d"/>
          <!-- spokes -->
          <g stroke="#c4a882" stroke-width="2">
            <line x1="-80" y1="15" x2="-80" y2="125"/>
            <line x1="-135" y1="70" x2="-25" y2="70"/>
            <line x1="-120" y1="30" x2="-40" y2="110"/>
            <line x1="-120" y1="110" x2="-40" y2="30"/>
            <line x1="80" y1="15" x2="80" y2="125"/>
            <line x1="25" y1="70" x2="135" y2="70"/>
            <line x1="40" y1="30" x2="120" y2="110"/>
            <line x1="40" y1="110" x2="120" y2="30"/>
          </g>
          <!-- frame -->
          <path d="M -80 70 L 10 -20 L 80 70 L 10 -20 L 40 -50 M 10 -20 L -20 70 M -20 70 L -80 70 M 40 -50 L 60 -55" fill="none" stroke="#e87a5d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="-50" r="10" fill="#fdf8f0" stroke="#3a1a0d" stroke-width="4"/>
          <path d="M 60 -55 L 85 -75" stroke="#3a1a0d" stroke-width="5" stroke-linecap="round"/>
          <!-- basket -->
          <path d="M -90 -10 L -50 -10 L -55 25 L -85 25 Z" fill="#c4a882" stroke="#76543d" stroke-width="4" stroke-linejoin="round"/>
          <line x1="-80" y1="-10" x2="-78" y2="25" stroke="#76543d" stroke-width="2"/>
          <line x1="-70" y1="-10" x2="-68" y2="25" stroke="#76543d" stroke-width="2"/>

      </g>
      <!-- colored art -->
      <g>

          <circle cx="-80" cy="70" r="55" fill="none" stroke="#3a1a0d" stroke-width="7"/>
          <circle cx="80" cy="70" r="55" fill="none" stroke="#3a1a0d" stroke-width="7"/>
          <circle cx="-80" cy="70" r="6" fill="#3a1a0d"/>
          <circle cx="80" cy="70" r="6" fill="#3a1a0d"/>
          <!-- spokes -->
          <g stroke="#c4a882" stroke-width="2">
            <line x1="-80" y1="15" x2="-80" y2="125"/>
            <line x1="-135" y1="70" x2="-25" y2="70"/>
            <line x1="-120" y1="30" x2="-40" y2="110"/>
            <line x1="-120" y1="110" x2="-40" y2="30"/>
            <line x1="80" y1="15" x2="80" y2="125"/>
            <line x1="25" y1="70" x2="135" y2="70"/>
            <line x1="40" y1="30" x2="120" y2="110"/>
            <line x1="40" y1="110" x2="120" y2="30"/>
          </g>
          <!-- frame -->
          <path d="M -80 70 L 10 -20 L 80 70 L 10 -20 L 40 -50 M 10 -20 L -20 70 M -20 70 L -80 70 M 40 -50 L 60 -55" fill="none" stroke="#e87a5d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="-50" r="10" fill="#fdf8f0" stroke="#3a1a0d" stroke-width="4"/>
          <path d="M 60 -55 L 85 -75" stroke="#3a1a0d" stroke-width="5" stroke-linecap="round"/>
          <!-- basket -->
          <path d="M -90 -10 L -50 -10 L -55 25 L -85 25 Z" fill="#c4a882" stroke="#76543d" stroke-width="4" stroke-linejoin="round"/>
          <line x1="-80" y1="-10" x2="-78" y2="25" stroke="#76543d" stroke-width="2"/>
          <line x1="-70" y1="-10" x2="-68" y2="25" stroke="#76543d" stroke-width="2"/>

      </g>
    </g>
  </g>
</svg>
