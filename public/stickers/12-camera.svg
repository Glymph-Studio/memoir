<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <g transform="translate(256 256)">
      <!-- white die-cut base (stroke creates the border) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">

          <rect x="-110" y="-70" width="220" height="150" rx="18" fill="#3a1a0d" stroke="#1d0d06" stroke-width="4"/>
          <rect x="-110" y="-70" width="220" height="40" rx="18" fill="#2a1308"/>
          <circle cx="0" cy="10" r="55" fill="#c4a882" stroke="#76543d" stroke-width="6"/>
          <circle cx="0" cy="10" r="38" fill="#3a1a0d" stroke="#76543d" stroke-width="4"/>
          <circle cx="-12" cy="-2" r="10" fill="#8fb8d8" opacity="0.8"/>
          <rect x="60" y="-55" width="22" height="12" rx="3" fill="#e87a5d"/>
          <circle cx="-80" cy="20" r="8" fill="#e87a5d"/>

      </g>
      <!-- colored art -->
      <g>

          <rect x="-110" y="-70" width="220" height="150" rx="18" fill="#3a1a0d" stroke="#1d0d06" stroke-width="4"/>
          <rect x="-110" y="-70" width="220" height="40" rx="18" fill="#2a1308"/>
          <circle cx="0" cy="10" r="55" fill="#c4a882" stroke="#76543d" stroke-width="6"/>
          <circle cx="0" cy="10" r="38" fill="#3a1a0d" stroke="#76543d" stroke-width="4"/>
          <circle cx="-12" cy="-2" r="10" fill="#8fb8d8" opacity="0.8"/>
          <rect x="60" y="-55" width="22" height="12" rx="3" fill="#e87a5d"/>
          <circle cx="-80" cy="20" r="8" fill="#e87a5d"/>

      </g>
    </g>
  </g>
</svg>
